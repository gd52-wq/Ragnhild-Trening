<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ragnhild Supersterk Pro 💪</title>
    
    <!-- Henter Tailwind CSS for styling og grafikk -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Henter React slik at logikken fungerer direkte i nettleseren -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            /* Her er hundebildet. Gjort ekstra synlig med de nye gjennomsiktige kortene */
            background: url('bedlington.jpg') no-repeat center center fixed; 
            background-size: cover;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Skjuler scrollbar, men lar deg scrolle */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Ikoner ---
        const Play = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const Pause = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const RotateCcw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>;
        const Calendar = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const CheckCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const ChevronRight = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const Clock = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const ArrowLeft = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;

        // --- Treningsdata for Ragnhild ---
        const WORKOUTS = [
          {
            id: 'dag-1',
            title: 'Dag 1: Bein & Rygg (+ Biceps)',
            description: 'Fokus på bein og rygg. Lagt til manual-curl for ekstra biceps-volum!',
            exercises: [
              { id: 'm1', name: 'Magen og ryggen - kombo', sets: 3, reps: '10', rest: 60, desc: 'Pust ut på vei opp.' },
              { id: 'm2', name: 'Sittende Roing', sets: 3, reps: '10-12', rest: 90, desc: 'Godt grep.' },
              { id: 'm3', name: 'Gående utfall', sets: 3, reps: '10 per bein', rest: 90, desc: 'Hold manualer.' },
              { id: 'm4', name: 'Benkpress m/stopp', sets: 7, reps: '1x8, 2x6, 2x5, 2x4', rest: 120, desc: 'Husk stopp på hver rep.' },
              { id: 'm5', name: 'Liggende lårcurl', sets: 3, reps: '10-12', rest: 90, desc: 'Bakside lår.' },
              { id: 'new_bic1', name: 'Bicepscurl m/manualer', sets: 3, reps: '10-12', rest: 60, desc: 'NY: Stående eller sittende. Klem på toppen!' }
            ]
          },
          {
            id: 'dag-2',
            title: 'Dag 2: Overkropp (+ Biceps)',
            description: 'Smal benkpress, nedtrekk og facepulls. Lagt til hammer curls.',
            exercises: [
              { id: 'o1', name: 'Pallof Press (Kabel)', sets: 3, reps: '10', rest: 60, desc: 'Stå sidelengs, press håndtaket rett frem. Motstå rotasjon. Pust ut på press.' },
              { id: 'o2', name: 'Nedtrekk (bredt)', sets: 3, reps: '10', rest: 90, desc: 'Trekk mot bryst.' },
              { id: 'o3', name: 'Leg Extension / Lårcurl', sets: 3, reps: '12', rest: 60, desc: 'Fremside lår.' },
              { id: 'o4', name: 'Smal benkpress', sets: 6, reps: '1x6, 2x5, 3x4', rest: 120, desc: 'Skulderbredde.' },
              { id: 'o5', name: 'Facepulls/maskin', sets: 3, reps: '15', rest: 60, desc: 'Holdning.' },
              { id: 'new_bic2', name: 'Hammer curls', sets: 3, reps: '10-12', rest: 60, desc: 'NY: Hold manualene med nøytralt grep (som en hammer). Bygger tykkelse i armen.' }
            ]
          },
          {
            id: 'dag-3',
            title: 'Dag 3: Fullkropp (+ Biceps)',
            description: 'Tunge bein og benkpress. Avslutter med pump i kabel-biceps.',
            exercises: [
              { id: 'f1', name: 'Planke på knær/tær', sets: 3, reps: '30 sek', rest: 60, desc: 'Hold spennet.' },
              { id: 'f2', name: 'Hip Thrust (Maskin)', sets: 3, reps: '12', rest: 120, desc: 'Skvis rumpa!' },
              { id: 'f3', name: 'Bulgarsk utfall', sets: 3, reps: '8 per bein', rest: 120, desc: 'Tungt for beina.' },
              { id: 'f4', name: 'Benkpress m/stopp', sets: 6, reps: '2x6, 2x5, 2x3', rest: 120, desc: '1 sek markert stopp på brystet.' },
              { id: 'f5', name: 'Sittende lårcurl', sets: 3, reps: '12', rest: 60, desc: 'Fremside lår.' },
              { id: 'new_bic3', name: 'Bicepscurl i kabel', sets: 3, reps: '10-15', rest: 60, desc: 'NY: Bruk stang eller tau. Konstant spenn i muskelen.' }
            ]
          }
        ];

        function App() {
          const [activeWorkoutId, setActiveWorkoutId] = useState(null);
          
          // Egen historikk-nøkkel for Ragnhild
          const [workoutHistory, setWorkoutHistory] = useState(() => {
            const saved = localStorage.getItem('ragnhild_workout_history');
            return saved ? JSON.parse(saved) : {};
          });
          
          const [timeLeft, setTimeLeft] = useState(0);
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [timerMax, setTimerMax] = useState(90);

          const [completedSets, setCompletedSets] = useState({});

          useEffect(() => {
            localStorage.setItem('ragnhild_workout_history', JSON.stringify(workoutHistory));
          }, [workoutHistory]);

          useEffect(() => {
            let intervalId;
            if (isTimerRunning && timeLeft > 0) {
              intervalId = setInterval(() => {
                setTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (timeLeft === 0 && isTimerRunning) {
              setIsTimerRunning(false);
            }
            return () => {
              if (intervalId) clearInterval(intervalId);
            };
          }, [isTimerRunning, timeLeft]);

          const startTimer = (seconds) => {
            setTimeLeft(seconds);
            setTimerMax(seconds);
            setIsTimerRunning(true);
          };

          const toggleTimer = () => {
            if (timeLeft > 0) setIsTimerRunning(!isTimerRunning);
          };

          const resetTimer = () => {
            setIsTimerRunning(false);
            setTimeLeft(timerMax);
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          const toggleSet = (exerciseId, setIndex) => {
            const key = `${activeWorkoutId}-${exerciseId}-${setIndex}`;
            setCompletedSets(prev => ({
              ...prev,
              [key]: !prev[key]
            }));
          };

          const finishWorkout = () => {
            const today = new Date().toLocaleDateString('no-NO', { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            });
            
            setWorkoutHistory(prev => ({
              ...prev,
              [activeWorkoutId]: today
            }));
            
            setCompletedSets({});
            setActiveWorkoutId(null);
          };

          const activeWorkout = WORKOUTS.find(w => w.id === activeWorkoutId);

          if (!activeWorkoutId) {
            return (
              // Endret til bg-slate-900/30 for mer gjennomsiktighet på hovedbakgrunnen
              <div className="min-h-screen bg-slate-900/30 text-slate-900 p-4 md:p-8 backdrop-blur-sm">
                <div className="max-w-2xl mx-auto pt-6">
                  {/* Endret til bg-white/65 for at bildet skinner gjennom */}
                  <header className="mb-8 text-center md:text-left bg-white/70 p-6 rounded-2xl shadow-sm backdrop-blur-md border border-white/50">
                    <h1 className="text-3xl font-bold text-slate-900 mb-2">Ragnhild Supersterk Pro 💪🐾</h1>
                    <p className="text-slate-700 font-medium">Velg dagens økt og bygg de bicepsene!</p>
                  </header>

                  <div className="space-y-4">
                    {WORKOUTS.map((workout) => (
                      <button
                        key={workout.id}
                        onClick={() => setActiveWorkoutId(workout.id)}
                        className="w-full bg-white/75 p-6 rounded-2xl shadow-md border border-white/50 hover:bg-white/85 hover:shadow-lg transition-all text-left group flex flex-col md:flex-row md:items-center justify-between backdrop-blur-md"
                      >
                        <div>
                          {/* Oransje tema! */}
                          <h2 className="text-xl font-bold text-orange-600 mb-1">{workout.title}</h2>
                          <p className="text-slate-700 text-sm mb-3 md:mb-0 font-medium">{workout.description}</p>
                        </div>
                        
                        <div className="flex items-center gap-4 text-sm mt-2 md:mt-0">
                          {workoutHistory[workout.id] ? (
                            <div className="flex items-center text-emerald-800 bg-emerald-100/90 px-3 py-1.5 rounded-full font-bold">
                              <CheckCircle className="w-4 h-4 mr-2" />
                              Sist: {workoutHistory[workout.id].split(',')[0]}
                            </div>
                          ) : (
                            <div className="flex items-center text-slate-600 bg-slate-200/80 px-3 py-1.5 rounded-full font-medium">
                              <Calendar className="w-4 h-4 mr-2" />
                              Ikke registrert
                            </div>
                          )}
                          <ChevronRight className="w-5 h-5 text-orange-400 group-hover:text-orange-600 transition-colors hidden md:block" />
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-900/30 text-slate-900 pb-32">
              <div className="bg-white/70 backdrop-blur-md border-b border-white/40 sticky top-0 z-10 shadow-sm">
                <div className="max-w-2xl mx-auto p-4 flex items-center justify-between">
                  <button 
                    onClick={() => setActiveWorkoutId(null)}
                    className="p-2 hover:bg-white/50 rounded-full transition-colors flex items-center text-slate-800 font-bold"
                  >
                    <ArrowLeft className="w-5 h-5 mr-1" />
                    <span className="hidden md:inline font-medium">Tilbake</span>
                  </button>
                  <h2 className="text-lg font-bold text-slate-900 truncate px-4">{activeWorkout.title}</h2>
                  <div className="w-20"></div>
                </div>
              </div>

              <div className="max-w-2xl mx-auto p-4 space-y-6 mt-4">
                {activeWorkout.exercises.map((exercise) => (
                  <div key={exercise.id} className="bg-white/80 backdrop-blur-md rounded-2xl p-5 shadow-md border border-white/50">
                    <div className="flex justify-between items-start mb-4">
                      <div>
                        <h3 className="text-xl font-bold text-slate-900">{exercise.name}</h3>
                        <p className="text-sm font-bold text-orange-600 mt-1">
                          {exercise.sets} sett | Reps: {exercise.reps}
                        </p>
                        {exercise.desc && (
                          <p className="text-sm text-slate-800 font-medium mt-2 bg-white/50 p-3 rounded-lg border border-white/60 leading-relaxed shadow-sm">
                            💡 {exercise.desc}
                          </p>
                        )}
                      </div>
                      <button 
                        onClick={() => startTimer(exercise.rest)}
                        className="flex items-center gap-1.5 text-xs font-bold text-orange-700 bg-orange-100 hover:bg-orange-200 px-3 py-2.5 rounded-lg transition-colors shadow-sm"
                      >
                        <Clock className="w-4 h-4" />
                        {exercise.rest}s hvile
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-3 mt-4">
                      {Array.from({ length: exercise.sets }).map((_, i) => {
                        const isChecked = completedSets[`${activeWorkout.id}-${exercise.id}-${i}`];
                        return (
                          <button
                            key={i}
                            onClick={() => toggleSet(exercise.id, i)}
                            className={`w-12 h-12 rounded-xl text-lg font-bold flex items-center justify-center transition-all shadow-sm ${
                              isChecked 
                                ? 'bg-emerald-500 text-white shadow-inner shadow-emerald-700/20 scale-95 border-none' 
                                : 'bg-white/90 text-slate-600 hover:bg-orange-50 border-2 border-slate-300'
                            }`}
                          >
                            {isChecked ? <CheckCircle className="w-6 h-6" /> : i + 1}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}

                <button 
                  onClick={finishWorkout}
                  className="w-full mt-8 bg-orange-600 hover:bg-orange-700 text-white font-bold text-lg py-4 rounded-2xl shadow-xl hover:shadow-2xl transition-all flex items-center justify-center gap-2 border border-orange-500"
                >
                  <CheckCircle className="w-6 h-6" />
                  Registrer og avslutt økt
                </button>
              </div>

              {/* Flytende Timer */}
              {(timeLeft > 0 || isTimerRunning) && (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-slate-900/95 backdrop-blur-md text-white rounded-2xl shadow-2xl p-4 flex items-center justify-between border border-slate-700 z-50">
                  <div className="flex items-center gap-3">
                    <div className={`text-3xl font-mono font-bold ${timeLeft === 0 ? 'text-rose-400' : 'text-orange-400'}`}>
                      {formatTime(timeLeft)}
                    </div>
                    <div className="text-xs text-slate-300 font-bold uppercase tracking-wider">
                      {timeLeft === 0 ? 'Ferdig!' : 'Hvile'}
                    </div>
                  </div>
                  
                  <div className="flex gap-2">
                    <button 
                      onClick={toggleTimer}
                      className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors shadow-sm"
                    >
                      {isTimerRunning ? <Pause className="w-5 h-5 text-white" /> : <Play className="w-5 h-5 text-white" />}
                    </button>
                    <button 
                      onClick={resetTimer}
                      className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors shadow-sm"
                    >
                      <RotateCcw className="w-5 h-5 text-white" />
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
